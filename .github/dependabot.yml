# Group routine dependency updates to reduce PR/CI churn while keeping alerts enabled.
# Root npm dependencies and Actions update weekly; consumer fixtures stay deliberately pinned.
# Playwright copies and visual baselines must be upgraded together under manual validation.
# Dependabot branch pushes are excluded by ci.yml because their PRs already run validation.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - playgrounds/**
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Keep the Node.js 22 and validated jsdom test baselines under manual control.
      # Security alerts remain enabled; these packages do not get automatic PRs.
      - dependency-name: '@types/node'
      - dependency-name: jsdom
      - dependency-name: '@types/jsdom'
      # Upgrade all three pinned Playwright copies and reviewed baselines together.
      - dependency-name: '@playwright/test'
      # Declaration generation depends on the TypeScript 6 compiler API.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'

  # These compatibility fixtures intentionally use older supported versions.
  # Ignore both version and security-update PRs while retaining security alerts.
  - package-ecosystem: npm
    directories:
      - /playgrounds/vue2
      - /playgrounds/vue3
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
