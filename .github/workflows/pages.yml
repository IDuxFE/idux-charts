name: Deploy documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-documentation
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'IDuxFE/idux-charts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright builds the site and tests a fresh production preview.
      - run: pnpm exec playwright test e2e/pages.spec.ts --project=chromium
      - uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: packages/site/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a token that triggers Pages builds
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo '::error::Configure PAGES_DEPLOY_TOKEN (Contents: write) or RELEASE_GITHUB_TOKEN. GITHUB_TOKEN pushes do not trigger branch-based Pages builds.'
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
          token: ${{ secrets.PAGES_DEPLOY_TOKEN || secrets.RELEASE_GITHUB_TOKEN }}
      - uses: actions/download-artifact@v6
        with:
          name: documentation
          path: _site
      - name: Publish static files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test "$(cat _site/CNAME)" = charts.idux.site
          test -f _site/.nojekyll
          rsync -a --delete --exclude='.git' _site/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Documentation is unchanged.'
            exit 0
          fi
          git commit -m "docs: deploy ${SOURCE_SHA}"
          git push origin HEAD:gh-pages
