# Analyze workspace dependencies and enforce FOSSA license/security policies.
# Runs on main pushes, weekly and manually; FOSSA_ENABLED and FOSSA_API_KEY are required.
# Generate a scan-only lockfile because repository lockfiles are intentionally untracked.
# Analysis uploads this revision before the policy test; keep both steps in this order.
# No library execution is needed, so setup disables native package installation scripts.

name: FOSSA

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: >-
      github.repository == 'IDuxFE/idux-charts' &&
      github.ref == 'refs/heads/main' &&
      vars.FOSSA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: 'false'
      # Lockfiles are intentionally untracked. Generate a scan-only lockfile so
      # FOSSA can resolve the actual workspace dependency graph.
      - run: pnpm install --lockfile-only --ignore-scripts
      # The action selects either analyze or test; test does not upload a revision.
      - name: Upload dependency analysis
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
      # Analyze sets the title only at creation; edit also renames an existing project.
      - name: Align CLI project display name
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: fossa project edit
      - name: Check dependency policies
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true
