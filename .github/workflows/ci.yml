# Validate PR merge refs, feature pushes and release commits using the same checks.
# Release calls this workflow for main; main is excluded from the direct push trigger.
# Required CI result aggregates every check and verifies browser partition receipts.
# Keep Darwin visual baselines, consumer coverage and existing retry budgets intact.
# Matrices have no max-parallel cap; available runner capacity controls actual starts.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Changesets pushes a temporary branch and then the release PR branch.
    # The release PR gets its checks from pull_request instead.
    branches-ignore:
      - main
      - 'changesets-ghcommit-temp/**'
      - 'changeset-release/**'
      # Dependabot PRs already receive upstream pull_request CI.
      - 'dependabot/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

# Superseded PR/feature pushes need not consume the scarce macOS runners.
# Each main run validates its own SHA independently of other release runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  # jsdom unit tests need canvas; this is the only validation job retaining native setup.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:ci
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-${{ github.run_id }}
          overwrite: true
          path: coverage/
          retention-days: 7
          if-no-files-found: error

  # All browsers consume the same build and select disjoint cases from one run seed.
  # Keep macOS for reviewed screenshot baselines; array order is not runner priority.
  browser-tests:
    name: Browser tests (${{ matrix.browser }}, random third)
    runs-on: macos-15-intel
    needs: browser-build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox, chromium]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup browser workspace
        uses: ./.github/actions/setup
        with:
          install-scripts: 'false'
      - name: Download shared browser fixtures
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: .
      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser partition (including retries)
        env:
          IDUX_E2E_PREBUILT: '1'
        run: pnpm test:e2e:ci ${{ matrix.browser }}
      - name: Verify Chromium CJK label layout
        if: ${{ matrix.browser == 'chromium' }}
        env:
          IDUX_E2E_PREBUILT: '1'
          IDUX_E2E_TARGET: fixture
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/cjk-visual/results.json
        # Keep this known platform-sensitive regression deterministic even when
        # the random partition assigns its catalogue entry to another browser.
        # Separate output and list reporting preserve partition receipts/results.
        run: pnpm exec playwright test e2e/visual.spec.ts --project=chromium --grep 'bar above light demo visual baseline' --output=test-results/cjk-visual --reporter=list,json
      - name: Report browser tests
        if: ${{ !cancelled() }}
        uses: ./.github/actions/browser-reports
        with:
          browser: ${{ matrix.browser }}

  # Build site + chart fixture once; no browser or canvas execution occurs here.
  # Upload hidden files too because production output can include Pages metadata.
  browser-build:
    name: Build browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: 'false'
      - run: pnpm build:site
      - run: pnpm exec vite build --config e2e/fixture/vite.config.ts
      - uses: actions/upload-artifact@v7
        with:
          name: browser-build
          path: |
            packages/site/dist/
            e2e/fixture/dist/
          include-hidden-files: true
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  # Real tarball consumers verify Vue 2.6/3 integration and collect runtime coverage.
  # Only the root workspace skips scripts; prepare-playgrounds installs each consumer
  # normally so vue-demi/esbuild hooks still run in its own dependency environment.
  playground-tests:
    name: Playground (${{ matrix.vue }})
    env:
      CHARTS_COVERAGE: '1'
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vue: [vue2, vue3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: 'false'
      # Build and pack once per isolated runner, then install only its consumer.
      - run: pnpm playgrounds:prepare ${{ matrix.vue }}
      - name: Install Playground browser
        run: node scripts/ci-timing.mjs "Install Playground Chromium" pnpm --dir playgrounds/${{ matrix.vue }} exec playwright install --with-deps chromium
      - run: pnpm --dir playgrounds/${{ matrix.vue }} test:e2e
      - name: Summarize playground tests
        if: ${{ !cancelled() }}
        run: node scripts/e2e-summary.mjs playgrounds/${{ matrix.vue }}/test-results/results.json
      - name: Upload playground coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playground-coverage-${{ matrix.vue }}-${{ github.run_id }}
          overwrite: true
          path: coverage/playgrounds/${{ matrix.vue }}/
          retention-days: 7
          if-no-files-found: error
      - name: Upload playground reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playground-reports-${{ matrix.vue }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playgrounds/${{ matrix.vue }}/playwright-report/
            playgrounds/${{ matrix.vue }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Merge Linux unit counters with both macOS consumers using original-source maps.
  # Run IDs prevent reading artifacts from unrelated runs; both Vue results are required.
  combined-coverage:
    name: Combined coverage
    needs: [checks, playground-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: 'false'
      - uses: actions/download-artifact@v8
        with:
          name: unit-coverage-${{ github.run_id }}
          path: coverage/
      - uses: actions/download-artifact@v8
        with:
          pattern: playground-coverage-*-${{ github.run_id }}
          path: coverage/playgrounds/
      - run: pnpm coverage:merge
      - uses: actions/upload-artifact@v7
        with:
          name: combined-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/combined/
          retention-days: 7
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: >-
          github.repository == 'IDuxFE/idux-charts' &&
          (github.event_name == 'pull_request' || vars.CODECOV_ENABLED == 'true')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          # Keep uploads attached to upstream, including tokenless fork PRs.
          slug: ${{ github.repository }}
          # Public fork PRs use the action's tokenless fork branch support.
          token: >-
            ${{ github.actor != 'dependabot[bot]' &&
                (github.event_name != 'pull_request' ||
                 github.event.pull_request.head.repo.full_name == github.repository) &&
                secrets.CODECOV_TOKEN || '' }}
          # Dependabot also has no Actions secrets; use a tokenless branch prefix.
          override_branch: ${{ github.actor == 'dependabot[bot]' && format('dependabot:{0}', github.head_ref || github.ref_name) || '' }}
          files: ./coverage/combined/lcov.info
          disable_search: true
          fail_ci_if_error: true

  # Build published packages, then typecheck/run each pinned consumer independently.
  # Root installs skip canvas, but test-declarations installs consumer vue-demi normally.
  # Synchronize supported pairs with scripts/test-declarations.mjs when adding versions.
  compatibility:
    name: Compatibility (Vue ${{ matrix.vue }}, ECharts ${{ matrix.echarts }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vue: ['2.7.16', '3.5.44']
        echarts: ['5.4.3', '6.1.0']
        include:
          - vue: '2.6.14'
            echarts: '6.1.0'
    env:
      IDUX_DECLARATION_TARGET: ${{ matrix.vue }}/${{ matrix.echarts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: 'false'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:lib
      # --runtime also checks packed declarations; avoid testing them twice.
      - run: pnpm test:declarations --runtime

  # Domain and project-subpath deployments need distinct builds (Vite embeds SITE_BASE).
  # Keep both paths: passing the domain case does not validate subpath asset resolution.
  pages-smoke:
    name: Documentation (${{ matrix.deployment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: domain
            base: /
            domain: charts.idux.site
            tests: e2e/pages.spec.ts
          - deployment: subpath
            base: /idux-charts/
            domain: ''
            tests: e2e/pages.spec.ts e2e/site-theme.spec.ts
    env:
      SITE_BASE: ${{ matrix.base }}
      SITE_DOMAIN: ${{ matrix.domain }}
      IDUX_E2E_TARGET: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install-scripts: 'false'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test ${{ matrix.tests }} --project=chromium
      - name: Summarize documentation tests
        if: ${{ !cancelled() }}
        run: node scripts/e2e-summary.mjs test-results/results.json
      - name: Upload documentation browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-browser-reports-${{ matrix.deployment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Always report one required gate, even after failure/cancellation of a dependency.
  # Successful jobs alone are insufficient: receipts must prove every case ran once.
  ci:
    name: CI result
    if: ${{ always() }}
    needs:
      [
        checks,
        browser-build,
        browser-tests,
        playground-tests,
        combined-coverage,
        compatibility,
        pages-smoke,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-plans-*
          path: e2e-plans/
      - name: Verify complete, non-overlapping browser coverage
        run: node scripts/e2e-verify-plans.mjs e2e-plans
