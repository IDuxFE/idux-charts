name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Changesets pushes a temporary branch and then the release PR branch.
    # The release PR gets its checks from pull_request instead.
    branches-ignore:
      - main
      - 'changesets-ghcommit-temp/**'
      - 'changeset-release/**'
      # Dependabot PRs already receive upstream pull_request CI.
      - 'dependabot/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:ci
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          retention-days: 7
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: >-
          github.repository == 'IDuxFE/idux-charts' &&
          (github.event_name == 'pull_request' || vars.CODECOV_ENABLED == 'true')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          # Keep uploads attached to upstream, including tokenless fork PRs.
          slug: ${{ github.repository }}
          # Public fork PRs use the action's tokenless fork branch support.
          token: >-
            ${{ github.actor != 'dependabot[bot]' &&
                (github.event_name != 'pull_request' ||
                 github.event.pull_request.head.repo.full_name == github.repository) &&
                secrets.CODECOV_TOKEN || '' }}
          # Dependabot also has no Actions secrets; use a tokenless branch prefix.
          override_branch: ${{ github.actor == 'dependabot[bot]' && format('dependabot:{0}', github.head_ref || github.ref_name) || '' }}
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  browser-tests:
    name: Browser tests (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    # Preserve the OS used by the reviewed screenshot baselines.
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-reports-${{ matrix.browser }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playground-tests:
    name: Playground (${{ matrix.vue }})
    env:
      CHARTS_COVERAGE: '1'
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vue: [vue2, vue3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Build and pack once per isolated runner, then install only its consumer.
      - run: pnpm playgrounds:prepare ${{ matrix.vue }}
      - run: pnpm --dir playgrounds/${{ matrix.vue }} exec playwright install --with-deps chromium
      - run: pnpm --dir playgrounds/${{ matrix.vue }} test:e2e
      - name: Upload playground coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playground-coverage-${{ matrix.vue }}
          path: coverage/playgrounds/${{ matrix.vue }}/
          retention-days: 7
          if-no-files-found: error
      - name: Upload playground reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playground-reports-${{ matrix.vue }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playgrounds/${{ matrix.vue }}/playwright-report/
            playgrounds/${{ matrix.vue }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  combined-coverage:
    name: Combined coverage
    needs: [checks, playground-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v6
        with:
          name: unit-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
      - uses: actions/download-artifact@v6
        with:
          pattern: playground-coverage-*
          path: coverage/playgrounds/
      - run: pnpm coverage:merge
      - uses: actions/upload-artifact@v7
        with:
          name: combined-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/combined/
          retention-days: 7
          if-no-files-found: error

  compatibility:
    name: Compatibility (Vue ${{ matrix.vue }}, ECharts ${{ matrix.echarts }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        vue: ['2.7.16', '3.5.44']
        echarts: ['5.4.3', '6.1.0']
        include:
          - vue: '2.6.14'
            echarts: '6.1.0'
    env:
      IDUX_DECLARATION_TARGET: ${{ matrix.vue }}/${{ matrix.echarts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:lib
      # --runtime also checks packed declarations; avoid testing them twice.
      - run: pnpm test:declarations --runtime

  pages-smoke:
    name: Documentation (${{ matrix.deployment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: domain
            base: /
            domain: charts.idux.site
            tests: e2e/pages.spec.ts
          - deployment: subpath
            base: /idux-charts/
            domain: ''
            tests: e2e/pages.spec.ts e2e/site-theme.spec.ts
    env:
      SITE_BASE: ${{ matrix.base }}
      SITE_DOMAIN: ${{ matrix.domain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test ${{ matrix.tests }} --project=chromium
      - name: Upload documentation browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-browser-reports-${{ matrix.deployment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  ci:
    name: CI result
    if: ${{ always() }}
    needs: [checks, browser-tests, playground-tests, combined-coverage, compatibility, pages-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
