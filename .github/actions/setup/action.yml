name: Setup workspace
description: Install the pinned pnpm version and workspace dependencies
inputs:
  install-scripts:
    description: Run package install scripts and provision native canvas build dependencies
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22.14.0'
    - uses: pnpm/action-setup@v6
      with:
        version: '11.8.0'
    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml', '.pnpmfile.cjs') }}
        restore-keys: |
          pnpm-11-${{ runner.os }}-${{ runner.arch }}-
    # canvas falls back to a native build when a prebuilt binary is unavailable.
    - name: Install canvas build dependencies (Linux)
      if: runner.os == 'Linux' && inputs.install-scripts == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
    - name: Install canvas build dependencies (macOS)
      if: runner.os == 'macOS' && inputs.install-scripts == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: brew install pkg-config cairo pango libpng jpeg giflib librsvg pixman python-setuptools
    - name: Install workspace dependencies
      shell: bash
      env:
        INSTALL_SCRIPTS: ${{ inputs.install-scripts }}
      run: |
        if [ "$INSTALL_SCRIPTS" = 'true' ]; then
          pnpm install --no-lockfile --no-frozen-lockfile
        else
          pnpm install --no-lockfile --no-frozen-lockfile --ignore-scripts
        fi
