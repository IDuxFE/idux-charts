# Shared diagnostics for each browser partition, called even after test failure.
# Keep report artifacts distinct from small partition receipts used by final CI result.
# Report names include attempt IDs; receipts overwrite within a run for rerun consistency.
# A receipt is mandatory: missing assignments must fail the final coverage verification.

name: Report browser partition
description: Summarize tests and retain reports and complete partition receipts
inputs:
  browser:
    description: Playwright browser project
    required: true
runs:
  using: composite
  steps:
    - name: Summarize browser tests
      if: ${{ !cancelled() }}
      shell: bash
      run: node scripts/e2e-summary.mjs test-results/results.json
    - name: Upload browser reports and assignment
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: browser-reports-${{ inputs.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          playwright-report/
          test-results/
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload partition receipt
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: browser-plans-${{ inputs.browser }}
        path: test-results/ci-plan/
        overwrite: true
        retention-days: 7
        if-no-files-found: error
